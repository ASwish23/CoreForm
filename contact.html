<body>

    <button type="button" id="lang-ro" class="lang-btn" aria-pressed="true">RO</button>
    <button type="button" id="lang-en" class="lang-btn" aria-pressed="false">EN</button>
    <span class="lang-thumb" aria-hidden="true"></span>
</div>

    <!-- Navigare -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <img src="img/logo-pink-96.png" alt="CoreForm Logo" class="nav-logo-img" width="96" height="106" decoding="async">
                <span>CoreForm</span>
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/">Acasă</a></li>
                <li><a href="/marketing.html">Marketing</a></li>
                <li><a href="/despre-noi.html">Despre Mine</a></li>
                <li><a href="/contact.html" class="nav-active">Contact</a></li>
            </ul>
            <button class="hamburger" id="hamburger" aria-label="Deschide meniu" aria-expanded="false" aria-controls="navMenu">
                <div></div>
                <div></div>
                <div></div>
            </button>
        </div>
    </nav>

    <!-- Container Principal -->
    <main class="contact-wrapper" id="continut">
        <div class="contact-container">
            <h1 class="form-title">Detalii tale:</h1>
            
            <form id="contactForm" class="contact-form">
                <!-- Rând 1: Numele companiei + Număr telefon -->
                <div class="form-row">
                    <div class="form-group half">
                        <label for="companyName">Numele companiei*</label>
                        <input 
                            type="text" 
                            id="companyName" 
                            name="nume_companie" 
                            placeholder="Numele companiei tale"
                            required
                         autocomplete="organization">
                    </div>
                    <div class="form-group half">
                        <label for="phoneNumber">Numărul de telefon*</label>
                        <input 
                            type="tel" 
                            id="phoneNumber" 
                            name="telefon" 
                            placeholder="+40 XXX XXX XXX"
                            required
                         autocomplete="tel" inputmode="tel">
                    </div>
                </div>

                <!-- Rând 2: Email -->
                <div class="form-row">
                    <div class="form-group full">
                        <label for="email">Email*</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="email@companie.ro"
                            required
                         autocomplete="email">
                    </div>
                </div>

                <!-- Rând 3: Buget estimat -->
                <div class="form-row">
                    <div class="form-group full">
                        <label for="budget">Buget estimat</label>
                        <input 
                            type="text" 
                            id="budget" 
                            name="buget" 
                            placeholder="Ex: 5000 - 10000 EUR"
                         autocomplete="off">
                    </div>
                </div>

                <!-- Secțiunea Servicii -->
                <div class="services-section">
                    <h2 class="section-title">Ce servicii te interesează?</h2>
                    
                    <div class="checkbox-grid">
                        <!-- Coloana 1 -->
                        <div class="checkbox-column">
                            <div class="checkbox-group">
                                <input type="checkbox" id="contentCreation" name="servicii" value="content-creation">
                                <label for="contentCreation">Creare de conținut foto/video</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="webDesign" name="servicii" value="web-design">
                                <label for="webDesign">Web design</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="copywriting" name="servicii" value="copywriting">
                                <label for="copywriting">Copywriting</label>
                            </div>
                        </div>

                        <!-- Coloana 2 -->
                        <div class="checkbox-column">
                            <div class="checkbox-group">
                                <input type="checkbox" id="socialMedia" name="servicii" value="social-media">
                                <label for="socialMedia">Social media management</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="ads" name="servicii" value="ads">
                                <label for="ads">Ads</label>
                            </div>
                            <div class="checkbox-group">
                                <input type="checkbox" id="branding" name="servicii" value="branding">
                                <label for="branding">Branding</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Secțiunea Marketing -->
                <div class="form-row">
                    <div class="form-group full">
                        <label for="marketingPerspective">Perspectiva de marketing</label>
                        <input 
                            type="text" 
                            id="marketingPerspective" 
                            name="perspectiva_marketing" 
                            placeholder="Descrie viziunea ta de marketing"
                         autocomplete="off">
                    </div>
                </div>

                <!-- Mesaj / Detalii Proiect -->
                <div class="form-row">
                    <div class="form-group full">
                        <label for="projectDetails">Detalii proiect</label>
                        <textarea 
                            id="projectDetails" 
                            name="detalii_proiect" 
                            rows="6"
                            placeholder="Spune-mi mai multe despre proiectul tău..."
                        ></textarea>
                    </div>
                </div>

                <!-- Buton Submit -->
                <div class="form-actions">
                    <button type="submit" class="submit-btn" id="submitBtn">Trimite Propunerea</button>
                </div>

                <!-- Mesaj feedback (succes / eroare) -->
                <div id="formFeedback" role="alert" aria-live="polite" style="display:none; margin-top:1rem; padding:0.85rem 1.2rem; border-radius:8px; font-weight:500; text-align:center;"></div>
            </form>
        </div>
    </main>

                    <img src="sal-badge.png" alt="SAL - Soluționarea Alternativă a Litigiilor" style="height: 50px; width: auto; display: block;" decoding="async" loading="lazy" width="201" height="50">
                </a>
            </div>
        </div>
    </footer>

    <script>
        // ─── Mobile Hamburger Nav Toggle ──────────────────────────────────────────
        (function () {
            const hamburger = document.getElementById('hamburger');
            const navMenu = document.getElementById('navMenu');
            if (!hamburger || !navMenu) return;

            function closeMenu() {
                navMenu.classList.remove('active');
                hamburger.classList.remove('active');
                hamburger.setAttribute('aria-expanded', 'false');
            }

            hamburger.addEventListener('click', function () {
                const isActive = navMenu.classList.toggle('active');
                hamburger.classList.toggle('active', isActive);
                hamburger.setAttribute('aria-expanded', String(isActive));
            });

            navMenu.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', closeMenu);
            });

            window.addEventListener('scroll', function () {
                if (navMenu.classList.contains('active')) {
                    closeMenu();
                }
            }, { passive: true });
        })();

        // ─── EmailJS Initialization ───────────────────────────────────────────────
        emailjs.init('O153E-J7Jeem1qSvi');

        // ─── Pre-fill marketingPerspective from URL query param ───────────────────
        (function () {
            const params = new URLSearchParams(window.location.search);
            const pachet = params.get('pachet');
            if (pachet) {
                const field = document.getElementById('marketingPerspective');
                if (field) {
                    field.value = 'Pachet selectat: ' + pachet;
                    field.closest('.form-group')?.classList.add('focused');
                }
            }
        })();

        // ─── Contact Form Submission ──────────────────────────────────────────────
        document.getElementById('contactForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const form      = this;
            const submitBtn = document.getElementById('submitBtn');
            const feedback  = document.getElementById('formFeedback');

            // --- 1. Loading state ---
            submitBtn.textContent = 'Se trimite...';
            submitBtn.disabled    = true;
            feedback.style.display = 'none';

            // --- 2. Collect field values ---
            const numeCompanie         = form.nume_companie.value.trim();
            const telefon              = form.telefon.value.trim();
            const emailAddr            = form.email.value.trim();
            const buget                = form.buget.value.trim();
            const perspectiva          = form.perspectiva_marketing.value.trim();
            const detalii              = form.detalii_proiect.value.trim();

            // Aggregate multiple checkbox selections into a readable string
            const selectedServices = Array.from(
                form.querySelectorAll('input[name="servicii"]:checked')
            ).map(cb => cb.nextElementSibling?.textContent.trim() || cb.value);
            const servicii = selectedServices.length > 0
                ? selectedServices.join(', ')
                : 'Niciun serviciu selectat';

            // --- 3. Build the template parameters object ---
            // These keys must EXACTLY match the template variable names in your EmailJS template.
            const templateParams = {
                nume_companie:           numeCompanie,
                telefon:                 telefon,
                email:                   emailAddr,
                buget:                   buget,
                servicii:                servicii,
                perspectiva_marketing:   perspectiva,
                detalii_proiect:         detalii,
            };

            try {
                // --- 4. Send via EmailJS ---
                await emailjs.send('service_6dsjm16', 'template_cxee0sr', templateParams);

                // --- 5. Success: reset form and show confirmation ---
                form.reset();
                showFeedback(
                    feedback,
                    'Mesajul a fost trimis cu succes! Te voi contacta în curând.',
                    'success'
                );
            } catch (error) {
                // --- 6. Error: show polite error message ---
                console.error('EmailJS error:', error);
                showFeedback(
                    feedback,
                    'A apărut o eroare la trimiterea mesajului. Te rugăm să încerci din nou.',
                    'error'
                );
            } finally {
                // --- 7. Restore button regardless of outcome ---
                submitBtn.textContent = 'Trimite Propunerea';
                submitBtn.disabled    = false;
            }
        });

        /**
         * Displays a styled feedback message inside the given element.
         * @param {HTMLElement} el    - The feedback container element.
         * @param {string}      msg   - The message text to display.
         * @param {'success'|'error'} type - Determines the visual style.
         */
        function showFeedback(el, msg, type) {
            el.textContent = msg;
            el.style.display = 'block';
            if (type === 'success') {
                el.style.backgroundColor = 'rgba(44, 74, 59, 0.85)';
                el.style.border          = '1px solid #4caf91';
                el.style.color           = '#b7f0d8';
            } else {
                el.style.backgroundColor = 'rgba(120, 40, 40, 0.75)';
                el.style.border          = '1px solid #e57373';
                el.style.color           = '#ffd0d0';
            }
        }

        // ─── Input focus effects ──────────────────────────────────────────────────
        document.querySelectorAll('input, textarea').forEach(function (input) {
            input.addEventListener('focus', function () {
                this.parentElement.classList.add('focused');
            });
            input.addEventListener('blur', function () {
                this.parentElement.classList.remove('focused');
            });
        });
    </script>
